<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150">
  <!-- MoonBeam_IG crescent mark (same as the showcase video's end card). -->
  <defs>
    <linearGradient id="moonbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a5cff"/>
      <stop offset="1" stop-color="#1a1440"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="150" height="150" fill="#fff"/>
      <circle cx="92" cy="60" r="44" fill="#000"/>
    </mask>
  </defs>
  <rect width="150" height="150" rx="36" fill="url(#moonbg)"/>
  <circle cx="75" cy="75" r="46" fill="#5fe3ff" mask="url(#crescent)"/>
</svg>
